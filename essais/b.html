<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Matrice de rotation · essai B</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/vendor/katex/katex.min.css">
<style>
:root {
  --encre: #0b1530; --doux: #56607a; --fond: #ffffff; --pale: #f3f5fa; --trait: #0b1530;
  --acc: #ff5a1f; --acc-pale: #fff0e9; --ok: #00a870; --ok-pale: #e2f8ef; --ko: #e8364b; --ko-pale: #fde8eb;
  --x: #e8364b; --y: #00a870; --z: #2f5bff; --v: #8a3ffc;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--fond); color: var(--encre); overflow: hidden; }
body { font: 17px/1.45 "Space Grotesk", system-ui, sans-serif; -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; }
.mono { font-family: "JetBrains Mono", ui-monospace, monospace; }
button { font-family: inherit; color: inherit; }

/* Tableau de bord du haut */
.bord { position: absolute; top: 0; left: 0; right: 0; height: 172px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 28px; gap: 20px; z-index: 3; }
.missions { display: flex; flex-direction: column; gap: 10px; }
.missions .haut { display: flex; align-items: baseline; gap: 12px; }
.missions a { color: var(--doux); text-decoration: none; font-size: 15px; }
.missions b { font-size: 24px; letter-spacing: -0.01em; }
.points { display: flex; gap: 8px; }
.points button { width: 40px; height: 40px; border-radius: 12px; border: 2px solid var(--trait); background: #fff; font: 700 15px "JetBrains Mono", monospace; cursor: pointer; transition: background .3s, transform .2s; }
.points button.fait { background: var(--encre); color: #fff; }
.points button.courant { background: var(--acc); color: #fff; border-color: var(--acc); transform: translateY(-2px); }
.points button:disabled { opacity: .3; cursor: default; }

.matrices { display: flex; gap: clamp(10px, 1.6vw, 22px); align-items: center; }
.mat { display: flex; align-items: center; gap: 10px; }
.mat .nom { font-weight: 700; font-size: 20px; text-align: right; line-height: 1.1; }
.mat .nom small { display: block; font-weight: 500; font-size: 13px; color: var(--doux); }
.grille { display: grid; grid-template-columns: repeat(3, clamp(62px, 6.6vw, 84px)); gap: 6px; padding: 6px 10px; border-left: 3px solid var(--trait); border-right: 3px solid var(--trait); border-radius: 12px; }
.cel { height: 42px; border: 0; border-radius: 10px; background: transparent; font: 700 clamp(15px, 1.55vw, 19px) "JetBrains Mono", monospace; cursor: default; transition: background .25s, color .25s, transform .15s; }
.cel.active { cursor: pointer; background: var(--pale); }
.cel.active:active { transform: scale(.95); }
.cel.choisie { background: #ffe14d; }
.cel.bonne { background: var(--ok-pale); color: var(--ok) !important; }
.cel.mauvaise { background: var(--ko-pale); color: var(--ko) !important; }
.cel.eteinte { color: #c9cfdc !important; }
.vec { display: grid; grid-template-rows: repeat(3, 42px); gap: 6px; padding: 6px 10px; border-left: 3px solid var(--trait); border-right: 3px solid var(--trait); border-radius: 12px; }
.vec span { display: flex; align-items: center; justify-content: center; min-width: clamp(56px, 6vw, 76px); font: 700 clamp(15px, 1.55vw, 19px) "JetBrains Mono", monospace; color: var(--v); }
.flash { animation: flash .9s; }
@keyframes flash { 30% { background: var(--ok-pale); box-shadow: 0 0 0 8px var(--ok-pale); } }

.lecture { justify-self: end; text-align: right; }
.lecture .alpha { font: 700 clamp(32px, 3.9vw, 46px) "JetBrains Mono", monospace; letter-spacing: -0.03em; line-height: 1; }
.lecture small { color: var(--doux); font-size: 14px; }

/* Scène */
#scene { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }

/* Carte de mission */
.carte { position: absolute; left: 28px; bottom: 28px; width: min(430px, 37vw); background: #fff; border: 2.5px solid var(--trait); border-radius: 22px; box-shadow: 6px 6px 0 var(--trait); padding: 20px 22px 18px; z-index: 3; transition: transform .45s cubic-bezier(.2, .9, .3, 1.2), opacity .3s; }
.carte.cache { transform: translateY(30px); opacity: 0; pointer-events: none; }
.carte .etiq { display: inline-block; font: 700 13px "JetBrains Mono", monospace; letter-spacing: .06em; background: var(--acc); color: #fff; border-radius: 8px; padding: 3px 9px; margin-bottom: 10px; }
.carte h2 { margin: 0 0 8px; font-size: 25px; line-height: 1.18; letter-spacing: -0.015em; }
.carte p { margin: 0 0 12px; color: var(--doux); }
.carte .actions { display: flex; gap: 10px; flex-wrap: wrap; }
.retour { min-height: 26px; font-weight: 500; margin-top: 8px; }
.retour.ko { color: var(--ko); }
.retour.ok { color: var(--ok); }
.btn { height: 56px; padding: 0 24px; border: 2.5px solid var(--trait); border-radius: 16px; background: var(--acc); color: #fff; font-weight: 700; font-size: 18px; cursor: pointer; box-shadow: 3px 3px 0 var(--trait); transition: transform .1s, box-shadow .1s; }
.btn:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--trait); }
.btn.blanc { background: #fff; color: var(--encre); }
.btn:disabled { opacity: .35; }

/* Cadran */
.cadran { position: absolute; right: 28px; bottom: 28px; z-index: 3; display: flex; flex-direction: column; align-items: center; gap: 12px; transition: opacity .3s; }
.cadran.verrou { opacity: .35; pointer-events: none; }
.cadran svg { width: 236px; height: 236px; touch-action: none; display: block; }
.cadran .fins { display: flex; gap: 12px; }
.cadran .fins button { width: 64px; height: 52px; border: 2.5px solid var(--trait); border-radius: 14px; background: #fff; font: 700 20px "JetBrains Mono", monospace; cursor: pointer; box-shadow: 3px 3px 0 var(--trait); }
.cadran .fins button:active { transform: translate(3px, 3px); box-shadow: none; }

/* Débrief */
.debrief { position: absolute; left: 0; right: 0; bottom: 0; z-index: 5; background: #fff; border-top: 2.5px solid var(--trait); border-radius: 28px 28px 0 0; padding: 26px 40px 30px; transform: translateY(105%); transition: transform .55s cubic-bezier(.2, .9, .25, 1); max-height: 62vh; overflow-y: auto; box-shadow: 0 -18px 40px rgba(11, 21, 48, .12); }
.debrief.ouvert { transform: none; }
.debrief .tete { display: flex; align-items: center; gap: 14px; margin-bottom: 6px; }
.debrief h3 { margin: 0; font-size: 28px; letter-spacing: -0.015em; }
.debrief .corps { display: grid; grid-template-columns: 1.1fr 1fr; gap: 10px 40px; align-items: center; }
.debrief p { margin: 6px 0; font-size: 18px; }
.debrief .bas { margin-top: 14px; display: flex; gap: 12px; }
.tampon { width: 52px; height: 52px; flex: none; }
.tampon circle { fill: var(--ok); transform-box: fill-box; transform-origin: center; animation: pop .5s cubic-bezier(.3, 1.7, .5, 1); }
.tampon path { fill: none; stroke: #fff; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 40; stroke-dashoffset: 40; animation: trace .4s .25s forwards; }
@keyframes pop { from { transform: scale(0); } }
@keyframes trace { to { stroke-dashoffset: 0; } }
.onde { position: absolute; z-index: 4; pointer-events: none; border: 4px solid var(--ok); border-radius: 50%; width: 40px; height: 40px; margin: -20px 0 0 -20px; animation: onde .9s ease-out forwards; }
@keyframes onde { to { transform: scale(9); opacity: 0; border-width: 1px; } }
.secoue { animation: secoue .4s; }
@keyframes secoue { 20%, 60% { transform: translateX(-7px); } 40%, 80% { transform: translateX(7px); } }
@media (max-width: 1100px) { .lecture small { display: none; } }
.aide { position: absolute; top: 180px; left: 28px; color: var(--doux); font-size: 15px; z-index: 2; pointer-events: none; }
</style>
</head>
<body>
<svg id="scene" aria-label="Atelier en 3D : repère R0 et pince du robot"></svg>
<div class="bord">
  <div class="missions">
    <div class="haut"><a href="index.html">Essais</a><b>Matrice de rotation</b></div>
    <div class="points" id="points"></div>
  </div>
  <div class="matrices" id="matrices"></div>
  <div class="lecture"><div class="alpha" id="alpha">0°</div><small>α, rotation autour de z₀</small></div>
</div>
<div class="aide">Glisse un doigt sur le fond pour tourner la vue.</div>
<div class="carte" id="carte"></div>
<div class="cadran" id="cadran">
  <svg id="bouton" viewBox="0 0 236 236" aria-label="Cadran de rotation"></svg>
  <div class="fins"><button type="button" data-d="-1" aria-label="moins un degré">−1°</button><button type="button" data-d="1" aria-label="plus un degré">+1°</button></div>
</div>
<div class="debrief" id="debrief"></div>
<script src="../assets/vendor/katex/katex.min.js"></script>
<script src="../assets/vendor/katex/auto-render.min.js"></script>
<script src="commun.js"></script>
<script src="b.js"></script>
</body>
</html>
